services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: rutasur-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 10 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic envios.estados --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic envios.promesas --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic envios.reprogramaciones --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic alertas.sla --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic notificaciones.enviadas --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic envios.estados.dlq --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1"

  mongo:
    image: mongo:8
    container_name: rutasur-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:8
    container_name: rutasur-mongo-init
    depends_on:
      - mongo
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 5 &&
      mongosh --host mongo:27017 --eval
      \"try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }\""

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rutasur-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rutasur
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  projector:
    build: ./services/projector
    container_name: rutasur-projector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0

  notifications:
    build: ./services/notifications
    container_name: rutasur-notifications
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092

  rescheduling:
    build: ./services/rescheduling
    container_name: rutasur-rescheduling
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092

  sla-monitor:
    build: ./services/sla-monitor
    container_name: rutasur-sla-monitor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0

  analytics:
    build: ./services/analytics
    container_name: rutasur-analytics
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0

  simulator:
    build: ./simulator
    container_name: rutasur-simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092

  frontend:
    build: ./frontend
    container_name: rutasur-frontend
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0

volumes:
  mongo_data: